substitutions:
  name: atoms3-echo
  friendly_name: AtomS3 Echo

external_components:
  - source:
      type: git
      url: https://github.com/gpillon/home_assistant_atoms3_lite_echo_base
      ref: main
    components: [m5echo_base]

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  libraries:
    - Wire
    - ESP_I2S

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

globals:
  - id: mic_enabled
    type: bool
    restore_value: no
    initial_value: "true"

# --- M5 Echo Base Audio ---

m5echo_base:
  id: echo_base_hub
  sample_rate: 16000

speaker:
  - platform: m5echo_base
    id: echo_speaker
    m5echo_base_id: echo_base_hub
    volume: 80%

microphone:
  - platform: m5echo_base
    id: echo_mic
    m5echo_base_id: echo_base_hub

media_player:
  - platform: speaker
    id: echo_media_player
    name: "${friendly_name} Audio"
    announcement_pipeline:
      speaker: echo_speaker
      format: WAV
      sample_rate: 16000
      num_channels: 2
    buffer_size: 4000
    codec_support_enabled: false

# --- LED Feedback ---

light:
  - platform: esp32_rmt_led_strip
    id: atom_led
    name: "${friendly_name} LED"
    pin: GPIO35
    chipset: WS2812
    num_leds: 4
    rgb_order: GRB
    default_transition_length: 0s
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 30%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 30%
          max_brightness: 100%

script:
  - id: led_idle
    then:
      - light.turn_on:
          id: atom_led
          red: 0%
          green: 100%
          blue: 100%
          brightness: 25%
          effect: none

  - id: led_idle_no_mic
    then:
      - light.turn_on:
          id: atom_led
          red: 100%
          green: 100%
          blue: 0%
          brightness: 25%
          effect: none

  - id: led_off
    then:
      - light.turn_off: atom_led

# --- Button ---

binary_sensor:
  - platform: gpio
    id: atom_button
    name: "${friendly_name} Button"
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - if:
              condition:
                lambda: "return id(mic_enabled);"
              then:
                - lambda: "id(mic_enabled) = false;"
                - voice_assistant.stop:
                - script.execute: led_idle_no_mic
              else:
                - lambda: "id(mic_enabled) = true;"
                - voice_assistant.start_continuous:
                - script.execute: led_idle

# --- Voice Assistant ---

voice_assistant:
  id: va
  microphone:
    microphone: echo_mic
    channels: [0]
    gain_factor: 4
  media_player: echo_media_player
  use_wake_word: true
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 1.0

  on_client_connected:
    - delay: 2s
    - if:
        condition:
          lambda: "return id(mic_enabled);"
        then:
          - script.execute: led_idle
          - voice_assistant.start_continuous:
        else:
          - script.execute: led_idle_no_mic

  on_client_disconnected:
    - voice_assistant.stop:
    - light.turn_on:
        id: atom_led
        red: 100%
        green: 40%
        blue: 0%
        brightness: 30%
        effect: none

  on_listening:
    - light.turn_on:
        id: atom_led
        red: 0%
        green: 0%
        blue: 100%
        brightness: 100%
        effect: "Slow Pulse"

  on_stt_vad_end:
    - light.turn_on:
        id: atom_led
        red: 0%
        green: 0%
        blue: 100%
        brightness: 100%
        effect: "Fast Pulse"

  on_tts_start:
    - light.turn_on:
        id: atom_led
        red: 0%
        green: 100%
        blue: 0%
        brightness: 100%
        effect: none

  on_end:
    - delay: 200ms
    - if:
        condition:
          lambda: "return id(mic_enabled);"
        then:
          - script.execute: led_idle

  on_error:
    - light.turn_on:
        id: atom_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 100%
        effect: none
    - delay: 2s
    - if:
        condition:
          lambda: "return id(mic_enabled);"
        then:
          - script.execute: led_idle
        else:
          - script.execute: led_idle_no_mic
